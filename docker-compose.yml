services:
  mongo:
    image: mongo:8.0.4
    volumes:
      - mongo_data:/data/db
    command: ["--replSet", "rs0"]
    networks:
      - pdfinance-app

  api:
    image: petardjorovic/pdfinance-backend:latest
    env_file: ./backend/.env
    restart: unless-stopped
    networks:
      - pdfinance-app
    depends_on:
      - mongo

  frontend:
    image: petardjorovic/pdfinance-frontend:latest
    restart: unless-stopped
    networks:
      - pdfinance-app
    depends_on:
      - api

  caddy:
    image: petardjorovic/pdfinance-caddy:latest
    ports:
      - 80:80
      - 443:443
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - pdfinance-app
    depends_on:
      - api
      - frontend

networks:
  pdfinance-app:
    driver: bridge

volumes:
  mongo_data:
  caddy_config:
  caddy_data:
